[package]
name = "ferroforge-example-embedded"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
bench = false

[dependencies]
ferroforge = { path = "../ferroforge" }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.7"
defmt = { version = "1.1.1", default-features = false }
fugit = { version = "0.3.9", default-features = false }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f401"] }

[workspace]
