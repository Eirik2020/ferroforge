[package]
name = "ferroforge-task-msp-displayport"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
bench = false

# Portable: no HAL and no chip. The protocol lives in `msp`, which has no
# dependencies at all and is where the host tests are; this crate is only the
# two tasks and the state they share.
[dependencies]
ferroforge = { path = "../../../ferroforge" }
fugit = { version = "0.3.9", default-features = true, features = [] }
msp = { path = "../../msp" }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["cortex-m-systick"] }

[package.metadata.ferroforge]
check-only-dependencies = ["ferroforge"]

[workspace]
