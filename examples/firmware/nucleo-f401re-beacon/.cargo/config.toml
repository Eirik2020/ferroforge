[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = [
    "probe-rs",
    "run",
    "--chip",
    "STM32F401RE",
]
rustflags = [
    "-C", "link-arg=-L.",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info,ferroforge_task_blinky=off"
