[package]
name = "nucleo-f401re-beacon"
version = "0.1.0"
edition = "2024"
publish = false
build = false

[package.metadata.ferroforge]
# The chip this firmware is built for. Everything the chip implies -
# memory layout, probe identity, target triple, PAC path and platform
# crates - is derived from this, and nothing else records it.
chip = "stm32f401re"
# What goes into DEFMT_LOG. Everything, the blink counters included: each
# light announces itself by name, which is how a run tells the group's copies
# apart.
defmt-log = "info"

# FerroHAL is not on crates.io yet, so this firmware says where it comes from:
# the revision ferroforge-stm32 pins, so the two resolve to one FerroHAL.
[package.metadata.ferroforge.platform.ferrohal-stm32]
git = "https://github.com/Eirik2020/ferrohal-stm32"
rev = "d9ddc472eae17a335dd6fdd217af3c4dc4050d1b"

[[bin]]
name = "nucleo-f401re-beacon"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferroforge = { path = "../../../ferroforge" }
ferroforge-task-blinky = { path = "../../tasks/blinky" }
ferroforge-task-pulse = { path = "../../tasks/pulse" }

# This application's own choices: what it logs with and how it panics.
defmt = { version = "1.0.1", default-features = true, features = [] }
defmt-rtt = { version = "1.3.0", default-features = true, features = [] }
panic-probe = { version = "1.0.0", default-features = true, features = ["print-defmt"] }

# ferroforge:platform-dependencies for STM32F401RE - generated, do not edit
# source for ferrohal-stm32 from [package.metadata.ferroforge.platform]
cortex-m = { version = "0.7.7", default-features = true, features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.6", default-features = true, features = [] }
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "d9ddc472eae17a335dd6fdd217af3c4dc4050d1b", default-features = false, features = ["stm32f401re", "rtic"] }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["cortex-m-systick", "systick-64bit"] }
# ferroforge:end

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
