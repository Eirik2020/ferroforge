[package]
name = "ferroforge-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "RTIC firmware renderer for FerroForge application declarations"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
ferroforge-contracts = { path = "../ferroforge-contracts" }
ferroforge = { path = "../ferroforge" }
heck = "0.5"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
