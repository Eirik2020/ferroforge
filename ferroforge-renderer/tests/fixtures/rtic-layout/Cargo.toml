[package]
name = "ferroforge-rtic-layout-fixture"
version = "0.1.0"
edition = "2024"
publish = false
build = false

[[bin]]
name = "ferroforge-rtic-layout-fixture"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
fugit = "0.3.9"
panic-probe = "1.0.0"
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["cortex-m-systick"] }
rtt-target = "0.6.2"
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f401"] }

[workspace]
