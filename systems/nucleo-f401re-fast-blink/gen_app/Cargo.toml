[package]
name = "nucleo-f401re-fast-blink-rtic"
version = "0.1.0"
edition = "2024"
publish = false
build = false

[[bin]]
name = "nucleo-f401re-fast-blink-rtic"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", default-features = true, features = [] }
cortex-m-rt = { version = "0.7.6", default-features = true, features = [] }
defmt = { version = "1.0.1", default-features = true, features = [] }
defmt-rtt = { version = "1.3.0", default-features = true, features = [] }
embedded-hal = { version = "1.0.0", default-features = true, features = [] }
fugit = { version = "0.3.9", default-features = true, features = [] }
panic-probe = { version = "1.0.0", default-features = true, features = ["print-defmt"] }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["cortex-m-systick"] }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f401"] }

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
