[workspace]
resolver = "2"

# The call-through design needs three crates: argument parsing, the macros that
# expand reusable tasks and compositions, and the facade that re-exports them.
# Firmware and reusable task crates are their own workspaces, as G5 requires.
members = [
    "ferroforge",
    "ferroforge-cli",
    "ferroforge-contracts",
    "ferroforge-macros",
]
