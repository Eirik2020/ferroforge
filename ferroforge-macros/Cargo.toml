[package]
name = "ferroforge-macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Procedural macros for the FerroForge RTIC-like application model"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eirik2020/ferroforge"
keywords = ["embedded", "rtic", "proc-macro"]
categories = ["development-tools", "embedded"]
# The integration tests drive this repository's firmware and task crates, so
# they cannot run from the published source.
exclude = ["tests/"]

[lib]
proc-macro = true

[dependencies]
ferroforge-contracts = { version = "0.2.0", path = "../ferroforge-contracts" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
