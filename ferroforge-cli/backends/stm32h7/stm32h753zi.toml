# Chip-family data for the STM32H753ZI, as on the Nucleo-H753ZI.
#
# The first chip here from a different HAL, and the first with more memory than
# the FLASH/RAM pair `cortex-m-rt` needs. Per G2a this is still only build-time
# data read by the CLI, and per G4 it names no interrupts.

[chip]
name = "STM32H753ZI"
# Cortex-M7 with a double-precision FPU; this triple is the hard-float ARMv7E-M
# one, as for the M4F parts.
rust-target = "thumbv7em-none-eabihf"
# Verified against `probe-rs chip list`.
probe-rs-chip = "STM32H753ZI"
# Not `stm32f4xx_hal::pac`: a different HAL, so a different path. This is what
# makes `device` a property of the HAL rather than a constant.
device = "stm32h7xx_hal::pac"

[memory]
flash-origin = 0x08000000
flash-size = 2097152
# DTCM. `cortex-m-rt` puts .data, .bss and the stack in RAM, and DTCM is the
# lowest-latency choice for them; the HAL's own reference memory.x does the same.
# AXISRAM is larger but further away, so it is offered below rather than chosen.
ram-origin = 0x20000000
ram-size = 131072
# (16 exceptions + 150 interrupts) * 4 = 0x298, already 8-byte aligned. Taken
# from the PAC's `__INTERRUPTS` array and confirmed against a linked binary.
text-offset = 0x298

# The rest of what this part offers. Emitted so a firmware can place sections
# here; nothing is put in them automatically, because which memory suits which
# data is the application's decision. Addresses follow the HAL's own memory.x.
[[memory.region]]
name = "AXISRAM"
origin = 0x24000000
size = 524288

[[memory.region]]
name = "SRAM1"
origin = 0x30000000
size = 131072

[[memory.region]]
name = "SRAM2"
origin = 0x30020000
size = 131072

[[memory.region]]
name = "SRAM3"
origin = 0x30040000
size = 32768

[[memory.region]]
name = "SRAM4"
origin = 0x38000000
size = 65536

[[memory.region]]
name = "BSRAM"
origin = 0x38800000
size = 4096

[[memory.region]]
name = "ITCM"
origin = 0x00000000
size = 65536

# Crates a firmware for this chip cannot build without. Features here are
# chip- or architecture-derived, so they belong to the target rather than to
# the application. Logging and panic backends are the firmware's choice and are
# deliberately absent.
[platform-dependencies]
cortex-m = { version = "0.7.7" }
cortex-m-rt = { version = "0.7.6" }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["cortex-m-systick"] }
stm32h7xx-hal = { version = "0.16.0", default-features = false, features = ["stm32h753v", "rt"] }
