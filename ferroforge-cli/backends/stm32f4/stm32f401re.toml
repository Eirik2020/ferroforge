# Chip-family data for the Nucleo-F401RE's MCU.
#
# Per G2a this is the minimum FerroForge needs before a build, and it is read by
# the CLI rather than depended on by any firmware. It deliberately does not name
# interrupts: per G4 the device's own enum is the only interrupt list.

[chip]
name = "STM32F401RE"
rust-target = "thumbv7em-none-eabihf"
probe-rs-chip = "STM32F401RE"
# The PAC path a firmware passes to `#[rtic::app(device = ...)]`.
device = "stm32f4xx_hal::pac"

[memory]
flash-origin = 0x08000000
flash-size = 524288
ram-origin = 0x20000000
ram-size = 98304
# The F401 vector table ends at 0x194 - (16 exceptions + 85 interrupts) * 4,
# from the PAC's `__INTERRUPTS` array and confirmed against a linked binary.
# Start at the next 8-byte boundary to satisfy current rust-lld alignment.
text-offset = 0x198

# Crates a firmware for this chip cannot build without. Features here are
# chip- or architecture-derived, so they belong to the target rather than to
# the application. Logging and panic backends are the firmware's choice and are
# deliberately absent.
[platform-dependencies]
cortex-m = { version = "0.7.7" }
cortex-m-rt = { version = "0.7.6" }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["cortex-m-systick", "systick-64bit"] }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f401"] }

# A monotonic on a hardware timer rather than SysTick, for a firmware that sets
# `monotonic-timer`. rtic-monotonics names the chip once for all its timers, and
# that pulls in stm32-metapac, so none of this is added unless a firmware asks.
[timer-monotonic]
crate = "rtic-monotonics"
chip-feature = "stm32f401re"
timers = { TIM2 = "stm32_tim2", TIM3 = "stm32_tim3", TIM4 = "stm32_tim4", TIM5 = "stm32_tim5" }
