[package]
name = "nucleo-f401re-rtic"
version = "0.1.0"
edition = "2024"
publish = false
build = false

[[bin]]
name = "nucleo-f401re-rtic"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
defmt = { version = "1.1.1", default-features = false, features = [] }
defmt-rtt = "1.3.0"
fugit = { version = "0.3.9", default-features = false, features = [] }
panic-probe = { version = "1.0.0", default-features = true, features = ["print-defmt"] }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", default-features = false, features = ["stm32_tim5", "stm32f401re"] }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f401"] }

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
