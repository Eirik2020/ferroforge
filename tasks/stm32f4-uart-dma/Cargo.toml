[package]
name = "ferroforge-task-stm32f4-uart-dma"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
bench = false

[dependencies]
defmt = { version = "1.0.1", default-features = true, features = [] }
ferroforge = { path = "../../ferroforge" }
rtic = { version = "2.3.1", default-features = false, features = ["thumbv7-backend"] }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = [] }

[features]
# A HAL-specific crate cannot compile without a chip selected, but it must not
# be the one choosing. These forward to the HAL so a standalone check can name a
# chip while a firmware's own selection wins through feature unification.
stm32f401 = ["stm32f4xx-hal/stm32f401"]
stm32f405 = ["stm32f4xx-hal/stm32f405"]

[package.metadata.ferroforge]
check-only-dependencies = ["ferroforge"]

[workspace]
